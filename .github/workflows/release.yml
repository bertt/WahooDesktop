name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "Version (e.g. 1.2.3), build only, no release upload"
        required: true

permissions:
  contents: write

jobs:
  windows-installer:
    name: Windows installer ${{ matrix.arch }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x64, target: x86_64-pc-windows-msvc }
          - { arch: arm64, target: aarch64-pc-windows-msvc }
    steps:
      - uses: actions/checkout@v4

      - name: Determine version
        id: ver
        shell: pwsh
        run: |
          if ($env:GITHUB_EVENT_NAME -eq 'release') { $v = '${{ github.event.release.tag_name }}' } else { $v = '${{ inputs.version }}' }
          $v = $v.TrimStart('v')
          if ($v -notmatch '^\d+\.\d+\.\d+') { throw "Tag '$v' is not a semantic version (x.y.z)" }
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: Stamp version into Cargo.toml
        shell: pwsh
        run: |
          $f = 'Cargo.toml'
          $t = Get-Content $f -Raw
          $t = [regex]::Replace($t, '(?m)^version = ".*"', 'version = "${{ steps.ver.outputs.version }}"', 1)
          Set-Content $f $t -NoNewline

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Test
        if: matrix.arch == 'x64'
        run: cargo test --release

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build installer
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=${{ steps.ver.outputs.version }}" "/DArch=${{ matrix.arch }}" "/DBinDir=..\target\${{ matrix.target }}\release" installer\wahoo-desktop.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed" }

      - uses: actions/upload-artifact@v4
        with:
          name: WahooDesktop-Setup-${{ steps.ver.outputs.version }}-${{ matrix.arch }}
          path: dist/*.exe

      - name: Attach to release
        if: github.event_name == 'release'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" "dist/WahooDesktop-Setup-${{ steps.ver.outputs.version }}-${{ matrix.arch }}.exe" --clobber

  cli-package:
    name: CLI package ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macos-x64, os: macos-latest, target: x86_64-apple-darwin, kind: pkg }
          - { name: macos-arm64, os: macos-latest, target: aarch64-apple-darwin, kind: pkg }
          - { name: linux-x64, os: ubuntu-latest, target: x86_64-unknown-linux-gnu, kind: linux, goarch: amd64 }
          - { name: linux-arm64, os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu, kind: linux, goarch: arm64 }
    steps:
      - uses: actions/checkout@v4

      - name: Determine version
        id: ver
        shell: bash
        run: |
          if [ "$GITHUB_EVENT_NAME" = "release" ]; then v='${{ github.event.release.tag_name }}'; else v='${{ inputs.version }}'; fi
          v="${v#v}"
          echo "$v" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+' || { echo "Tag '$v' is not a semantic version"; exit 1; }
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Stamp version into Cargo.toml
        shell: bash
        run: sed -i.bak -E '0,/^version = ".*"/s//version = "${{ steps.ver.outputs.version }}"/' Cargo.toml && rm Cargo.toml.bak

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build CLI
        run: cargo build --release --no-default-features --bin wahoo_cli --target ${{ matrix.target }}

      - name: Build macOS .pkg
        if: matrix.kind == 'pkg'
        shell: bash
        run: |
          mkdir -p root/usr/local/bin dist
          cp target/${{ matrix.target }}/release/wahoo_cli root/usr/local/bin/
          pkgbuild --root root --identifier com.bertt.wahoo-cli --version ${{ steps.ver.outputs.version }} \
            --install-location / "dist/wahoo_cli-${{ steps.ver.outputs.version }}-${{ matrix.name }}.pkg"

      - name: Build Linux .deb and .rpm
        if: matrix.kind == 'linux'
        shell: bash
        run: |
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@latest
          mkdir dist
          printf '%s\n' \
            "name: wahoo-cli" \
            "arch: ${{ matrix.goarch }}" \
            "platform: linux" \
            "version: ${{ steps.ver.outputs.version }}" \
            "maintainer: bertt" \
            "description: Command line tool for the Wahoo ELEMNT" \
            "homepage: https://github.com/bertt/WahooDesktop" \
            "contents:" \
            "  - src: target/${{ matrix.target }}/release/wahoo_cli" \
            "    dst: /usr/bin/wahoo_cli" > nfpm.yaml
          "$(go env GOPATH)/bin/nfpm" package -p deb -t dist/
          "$(go env GOPATH)/bin/nfpm" package -p rpm -t dist/

      - uses: actions/upload-artifact@v4
        with:
          name: wahoo-cli-${{ matrix.name }}
          path: dist/*

      - name: Attach to release
        if: github.event_name == 'release'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" dist/* --clobber
