[package]
name = "wahoo-desktop"
version = "0.1.2"
edition = "2024"

[dependencies]
axum = "0.8.9"
chrono = "0.4.45"
clap = { version = "4.6.7", features = ["derive"] }
fitparser = "0.11.0"
nusb = "0.2.8"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tao = { version = "0.37.1", optional = true }
tokio = { version = "1.54.1", features = ["full"] }
tower = { version = "0.5.3", features = ["util"] }
ureq = { version = "3", features = ["json"] }
flate2 = "1"
lzma-rs = "0.3"
windows = { version = "0.62.2", features = ["Win32_Devices_PortableDevices", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_UI_Shell_PropertiesSystem", "Win32_Foundation", "Win32_System_Variant", "Win32_Storage_FileSystem"] }
wry = { version = "0.57.0", optional = true }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[features]
default = ["gui"]
gui = ["dep:tao", "dep:wry"]

[lib]
name = "wahoo_desktop"

[[bin]]
name = "wahoo-desktop"
path = "src/main.rs"
required-features = ["gui"]

[[bin]]
name = "wahoo_cli"
path = "src/bin/wahoo_cli.rs"
